<style>
  :root{
    --bg: #EDF1F3;
    --card: #FFFFFF;
    --ink: #1E2A38;
    --ink-soft: #5C6B7A;
    --accent: #E85D4E;
    --accent2: #2E7D8C;
    --warn: #B23A2E;
    --line: #D8DEE2;
    --white: #FFFFFF;
    font-size: 16px;
  }
  html[data-theme="dark"]{
    --bg: #10161F;
    --card: #1B232E;
    --ink: #E8ECEF;
    --ink-soft: #8A9AA8;
    --accent: #FF7A67;
    --accent2: #45A6B8;
    --warn: #E2574A;
    --line: #2C3742;
    --white: #10161F;
  }
  body, .card, .masthead, .tab, input, select{ transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh; display:flex; justify-content:center;
  }
  .display{ font-family:'Oswald', sans-serif; }
  button{ font-family: inherit; }
  .phone{ width: 100%; max-width: 460px; min-height: 100vh; background: var(--bg); display:flex; flex-direction:column; }
  .masthead{ background: var(--card); margin: 14px 14px 0 14px; border-radius: 14px 14px 0 0; padding: 18px 20px; border-top: 4px solid var(--accent); }
  .masthead-top{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ font-family:'Oswald', sans-serif; font-weight:700; font-size: 16px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink); }
  .text-btn{ background:none; border:none; color: var(--ink-soft); font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; padding: 8px 4px; cursor:pointer; border-bottom: 1px dotted var(--ink-soft); }
  .text-btn:hover{ color: var(--warn); border-color: var(--warn); }
  .headline{ margin-top: 14px; display:flex; gap: 22px; }
  .headline-stat .num{ font-family:'Oswald', sans-serif; font-weight:700; font-size: 26px; line-height:1.1; color: var(--ink); }
  .headline-stat .lbl{ font-size: 11px; color: var(--ink-soft); margin-top: 2px; text-transform:uppercase; letter-spacing:0.5px; }
  .tabs{ display:flex; margin: 0 14px; background: var(--card); border-radius: 0 0 14px 14px; padding: 6px; gap: 4px; }
  .tab{ flex:1; border:none; background: transparent; color: var(--ink-soft); font-size: 13px; font-weight: 600; padding: 11px 0; border-radius: 9px; cursor:pointer; min-height: 42px; }
  .tab.active{ background: var(--accent); color: var(--white); }
  .content{ flex:1; padding: 16px 14px 40px 14px; }
  .card{ background: var(--card); border-radius: 14px; padding: 18px 18px 20px 18px; margin-bottom: 14px; }
  label.field-label{ display:block; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px; margin-top: 16px; }
  label.field-label:first-child{ margin-top:0; }
  .row-2{ display:flex; gap: 12px; }
  .row-2 > div{ flex:1; }
  input[type="text"], input[type="number"], input[type="date"], select{
    width:100%; border: none; border-bottom: 2px solid var(--line); background: transparent;
    font-family: 'Oswald', sans-serif; font-size: 20px; padding: 9px 2px; color: var(--ink); min-height: 46px;
  }
  select{ font-family:'Inter', sans-serif; font-size:16px; font-weight:500; appearance:none; -webkit-appearance:none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
    background-position: calc(100% - 16px) center, calc(100% - 10px) center; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat;
  }
  input[type="text"]{ font-family: 'Inter', sans-serif; font-size:16px; }
  input:focus, select:focus{ outline: none; border-color: var(--accent); }
  input::placeholder{ color: var(--ink-soft); opacity: 0.5; }
  .unit-note{ font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
  .add-btn{
    width:100%; margin-top: 22px; background: var(--accent); color: var(--white); border: none; border-radius: 10px;
    padding: 15px 0; font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; cursor: pointer; min-height: 48px;
  }
  .add-btn.alt{ background: var(--accent2); }
  .add-btn:active{ opacity: 0.85; }
  .section-title{ font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 10px 2px; }
  .run-row{ display:flex; align-items:center; padding: 11px 0; border-bottom: 1px solid var(--line); gap: 10px; }
  .run-row:last-child{ border-bottom:none; }
  .type-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .run-main{ flex:1; min-width:0; }
  .run-date{ font-size: 11px; color: var(--ink-soft); }
  .run-type{ font-size: 13px; font-weight:600; }
  .run-stats{ text-align:right; font-family:'Oswald', sans-serif; font-size: 13px; color: var(--ink); white-space:nowrap; }
  .run-stats .pace{ font-size: 11px; color: var(--ink-soft); font-family:'Inter',sans-serif; }
  .run-note{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .del-btn{ background:none; border:none; color: var(--ink-soft); font-size: 20px; cursor:pointer; padding: 10px; line-height:1; min-width:40px; min-height:40px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .del-btn:hover{ color: var(--warn); }
  .empty-state{ text-align:center; padding: 24px 10px; color: var(--ink-soft); font-size: 13px; line-height: 1.5; }
  .nav-row{ display:flex; align-items:center; justify-content: space-between; margin-bottom: 6px; }
  .nav-btn{ background: none; border: none; font-size: 18px; color: var(--ink); cursor:pointer; padding: 8px 14px; min-width: 44px; min-height: 44px; }
  .nav-title{ font-family:'Oswald', sans-serif; font-weight:700; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; }
  .big-stat-row{ display:flex; gap: 22px; margin-top: 6px; flex-wrap:wrap; }
  .big-stat .num{ font-family:'Oswald', sans-serif; font-weight:700; font-size: 28px; color: var(--ink); }
  .big-stat .lbl{ font-size: 11px; color: var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px; }
  .muted{ color: var(--ink-soft); font-size: 12px; }
  .bar-row{ margin-bottom: 14px; }
  .bar-row:last-child{ margin-bottom:0; }
  .bar-row-top{ display:flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .bar-track{ height: 9px; background: var(--line); border-radius: 5px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius: 5px; }
  .weight-summary-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 10px; }
  .weight-current .num{ font-family:'Oswald', sans-serif; font-weight:700; font-size: 32px; }
  .weight-delta{ font-family:'Oswald', sans-serif; font-size: 15px; font-weight:600; }
  .weight-delta.down{ color: var(--accent2); }
  .weight-delta.up{ color: var(--warn); }
  .sparkline-wrap{ margin-top: 8px; }
  .modal-overlay{ position: fixed; inset: 0; background: rgba(30,42,56,0.5); display:flex; align-items:center; justify-content:center; z-index: 50; padding: 24px; }
  .modal-box{ background: var(--card); border-radius: 14px; padding: 22px 20px; max-width: 340px; width: 100%; }
  .modal-title{ font-weight: 700; font-size: 16px; margin-bottom: 8px; }
  .modal-text{ font-size: 13px; color: var(--ink-soft); line-height:1.5; margin-bottom: 18px; }
  .modal-actions{ display:flex; gap: 10px; }
  .modal-actions button{ flex:1; border:none; border-radius: 9px; padding: 12px 0; font-size: 13px; font-weight:700; cursor:pointer; min-height: 44px; }
  .modal-cancel{ background: var(--bg); color: var(--ink); }
  .modal-confirm{ background: var(--warn); color: var(--white); }
  .toast{
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--white);
    padding: 10px 18px; border-radius: 20px; font-size: 13px; z-index: 60; opacity: 0; transition: opacity 0.25s ease;
    pointer-events:none; max-width: 85%; text-align:center;
  }
  .toast.show{ opacity: 1; }
</style>
</head>
<body>
<div class="phone">
  <div class="masthead">
    <div class="masthead-top">
      <span class="brand">Marathon Log</span>
      <div style="display:flex; gap:14px; align-items:center;">
        <button class="text-btn" id="themeToggleBtn">Dark</button>
        <button class="text-btn" id="backupBtn">Backup</button>
      </div>
    </div>
    <div class="headline">
      <div class="headline-stat">
        <div class="num display" id="weekMiles">0</div>
        <div class="lbl">Miles this week</div>
      </div>
      <div class="headline-stat">
        <div class="num display" id="totalRuns">0</div>
        <div class="lbl">Total runs logged</div>
      </div>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab active" data-tab="run">Log Run</button>
    <button class="tab" data-tab="weight">Weight</button>
    <button class="tab" data-tab="overview">Overview</button>
  </nav>
  <main class="content" id="content"></main>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'marathon_log_data_v1';
const RUN_TYPES = [
  {key:'standard', label:'Standard', color:'#7A8A99'},
  {key:'long', label:'Long Run', color:'#2E7D8C'},
  {key:'speed', label:'Speed Work', color:'#E85D4E'},
  {key:'race', label:'Race', color:'#C99A3B'},
];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let runs = [];
let weights = [];
let activeTab = 'run';
const today = new Date();
let monthCursor = { y: today.getFullYear(), m: today.getMonth() };
let yearCursor = today.getFullYear();
let expandedRunId = null;

function typeInfo(key){ return RUN_TYPES.find(t => t.key === key) || RUN_TYPES[0]; }
function todayISO(){
  const y = today.getFullYear(), m = String(today.getMonth()+1).padStart(2,'0'), d = String(today.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function currentYM(){ return `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`; }
function parseISO(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function formatShortDate(iso){ const d = parseISO(iso); return `${MONTH_SHORT[d.getMonth()]} ${d.getDate()}`; }
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function escapeHTML(s){ const div = document.createElement('div'); div.textContent = s == null ? '' : s; return div.innerHTML; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}
function formatDuration(sec){
  sec = Math.round(sec);
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  const s = sec%60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function formatPace(sec, miles){
  if (!miles) return '—';
  const p = sec / miles;
  const m = Math.floor(p/60);
  const s = Math.round(p%60);
  return `${m}:${String(s).padStart(2,'0')}/mi`;
}

// ---------- calorie estimate (ACSM running/walking VO2 formula + Mifflin-St Jeor resting rate) ----------
// Calories are computed once, using the weight logged as of that run's date, and stored on the
// run record itself — they intentionally do NOT get recalculated later if newer weight is logged.
const PROFILE = { heightCm: 182.88, age: 30, sex: 'male' }; // 6'0", 30, male
function latestWeightLb(){
  const sorted = weights.slice().sort((a,b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt));
  return sorted.length ? sorted[0].weight : null;
}
function weightAsOfDate(dateISO){
  const eligible = weights.filter(w => w.date <= dateISO);
  if (!eligible.length) return null;
  const sorted = eligible.slice().sort((a,b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt));
  return sorted[0].weight;
}
function computeCalories(mileage, seconds, wLb){
  if (!wLb || !mileage || !seconds) return null;
  const weightKg = wLb / 2.20462;
  const speedMph = mileage / (seconds/3600);
  const speedMPerMin = speedMph * 26.8224;
  const vo2 = speedMph >= 5 ? (0.2*speedMPerMin + 3.5) : (0.1*speedMPerMin + 3.5); // ACSM running vs walking equation
  const kcalPerMin = vo2 * weightKg / 200;
  const gross = kcalPerMin * (seconds/60);
  const bmrPerDay = 10*weightKg + 6.25*PROFILE.heightCm - 5*PROFILE.age + (PROFILE.sex === 'male' ? 5 : -161); // Mifflin-St Jeor
  const restingForDuration = (bmrPerDay/1440) * (seconds/60);
  return { gross: Math.round(gross), net: Math.round(Math.max(gross - restingForDuration, 0)) };
}
function backfillMissingCalories(){
  let changed = false;
  runs.forEach(r => {
    if (r.calGross === undefined || r.calGross === null) {
      const wLb = weightAsOfDate(r.date);
      const cal = computeCalories(r.mileage, r.seconds, wLb);
      r.calGross = cal ? cal.gross : null;
      r.calNet = cal ? cal.net : null;
      r.calWeightLb = wLb;
      if (cal) changed = true;
    }
  });
  if (changed) saveData();
}

// ---------- persistence (plain browser storage — this device only) ----------
function saveData(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ runs, weights })); } catch(e){ showToast("Couldn't save — check your browser's storage settings"); }
}
function loadData(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    runs = d.runs || []; weights = d.weights || [];
  } catch(e){}
}

// ---------- modal ----------
function openModal({title, text, confirmLabel, onConfirm}){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <div class="modal-title">${title}</div>
        <div class="modal-text">${text}</div>
        <div class="modal-actions">
          <button class="modal-cancel" id="modalCancel">Cancel</button>
          <button class="modal-confirm" id="modalConfirm">${confirmLabel}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modalCancel').onclick = () => root.innerHTML = '';
  document.getElementById('modalOverlay').onclick = (e) => { if (e.target.id === 'modalOverlay') root.innerHTML = ''; };
  document.getElementById('modalConfirm').onclick = () => { root.innerHTML = ''; onConfirm(); };
}

// ---------- sparkline ----------
function sparklineSVG(points, color){
  if (points.length < 2) return `<div class="empty-state" style="padding:16px 0;">Log a few more entries to see a trend.</div>`;
  const width = 280, height = 60, pad = 6;
  const ys = points.map(p => p.y);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const rangeY = (maxY - minY) || 1;
  const stepX = (width - pad*2) / (points.length - 1);
  const coords = points.map((p,i) => {
    const x = pad + i*stepX;
    const y = height - pad - ((p.y - minY)/rangeY)*(height - pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="display:block;">
    <polyline points="${coords}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

// ---------- masthead ----------
function renderMasthead(){
  const now = new Date();
  const dow = now.getDay(); // 0=Sun
  const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - dow);
  const startISO = `${startOfWeek.getFullYear()}-${String(startOfWeek.getMonth()+1).padStart(2,'0')}-${String(startOfWeek.getDate()).padStart(2,'0')}`;
  const weekMiles = runs.filter(r => r.date >= startISO && r.date <= todayISO()).reduce((s,r) => s + r.mileage, 0);
  document.getElementById('weekMiles').textContent = weekMiles.toFixed(1);
  document.getElementById('totalRuns').textContent = String(runs.length);
}

// ---------- LOG RUN tab ----------
function renderRunTab(){
  const recent = runs.slice().sort((a,b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt)).slice(0, 30);
  const options = RUN_TYPES.map(t => `<option value="${t.key}">${t.label}</option>`).join('');
  const listHTML = recent.length ? recent.map(r => {
    const t = typeInfo(r.type);
    return `
    <div class="run-row">
      <span class="type-dot" style="background:${t.color}"></span>
      <div class="run-main">
        <div class="run-date">${formatShortDate(r.date)}</div>
        <div class="run-type">${t.label}</div>
        ${r.note ? `<div class="run-note">${escapeHTML(r.note)}</div>` : ''}
      </div>
      <div class="run-stats display">
        ${r.mileage.toFixed(1)} mi &middot; ${formatDuration(r.seconds)}
        <div class="pace">${formatPace(r.seconds, r.mileage)}${r.calGross ? ` &middot; ~${r.calGross} cal` : ''}</div>
      </div>
      <button class="del-btn" data-del-run="${r.id}">&times;</button>
    </div>`;
  }).join('') : `<div class="empty-state">No runs logged yet. Add your first one above.</div>`;

  return `
    <div class="card">
      <label class="field-label" for="runType">Run type</label>
      <select id="runType">${options}</select>
      <label class="field-label" for="runMileage">Mileage</label>
      <input type="text" id="runMileage" inputmode="decimal" placeholder="e.g. 6.2">
      <label class="field-label">Time</label>
      <div class="row-2">
        <div>
          <input type="text" id="runMinutes" inputmode="numeric" pattern="[0-9]*" placeholder="Minutes">
        </div>
        <div>
          <input type="text" id="runSeconds" inputmode="numeric" pattern="[0-9]*" placeholder="Seconds">
        </div>
      </div>
      <div class="unit-note">e.g. 52 min 30 sec &mdash; for a race over an hour, just keep going past 60 minutes (e.g. 195 min for 3:15:00)</div>
      <label class="field-label" for="runDate">Date</label>
      <input type="date" id="runDate" value="${todayISO()}">
      <label class="field-label" for="runNote">Notes <span style="text-transform:none;letter-spacing:0;">(optional)</span></label>
      <input type="text" id="runNote" placeholder="e.g. felt strong, new shoes">
      <button class="add-btn" id="logRunBtn">+ Log run</button>
      ${!latestWeightLb() ? `<div class="unit-note" style="margin-top:14px;">Log your weight on the Weight tab to see calorie estimates on your runs.</div>` : ''}
    </div>
    <div class="section-title">Recent runs</div>
    <div class="card">${listHTML}</div>
  `;
}
function attachRunHandlers(){
  document.getElementById('logRunBtn').onclick = () => {
    const type = document.getElementById('runType').value;
    const mileageEl = document.getElementById('runMileage');
    const mileage = parseFloat(mileageEl.value);
    const minEl = document.getElementById('runMinutes');
    const secEl = document.getElementById('runSeconds');
    const minutes = parseFloat(minEl.value) || 0;
    const seconds = parseFloat(secEl.value) || 0;
    const date = document.getElementById('runDate').value || todayISO();
    const note = document.getElementById('runNote').value.trim();
    if (!mileage || mileage <= 0) { mileageEl.style.borderColor = 'var(--warn)'; showToast('Enter a mileage greater than 0'); return; }
    if (minutes <= 0 && seconds <= 0) { minEl.style.borderColor = 'var(--warn)'; showToast('Enter a time for this run'); return; }
    const totalSeconds = minutes*60 + seconds;
    const wLb = weightAsOfDate(date);
    const cal = computeCalories(mileage, totalSeconds, wLb);
    const entry = {
      id: 'r'+Date.now()+Math.random().toString(36).slice(2,7), date, type, mileage, seconds: totalSeconds, note,
      calGross: cal ? cal.gross : null, calNet: cal ? cal.net : null, calWeightLb: wLb, createdAt: Date.now()
    };
    runs.push(entry); saveData(); showToast('Run logged'); render();
  };
  document.querySelectorAll('[data-del-run]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-del-run');
      openModal({
        title: 'Delete this run?',
        text: "This removes it from your log permanently.",
        confirmLabel: 'Delete',
        onConfirm: () => { runs = runs.filter(r => r.id !== id); saveData(); showToast('Run deleted'); render(); }
      });
    };
  });
}

// ---------- WEIGHT tab ----------
function renderWeightTab(){
  const sorted = weights.slice().sort((a,b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt));
  const latest = sorted[0];
  const prev = sorted[1];
  const delta = latest && prev ? (latest.weight - prev.weight) : null;
  const listHTML = sorted.length ? sorted.slice(0,30).map((w,i) => {
    const next = sorted[i+1];
    const d = next ? (w.weight - next.weight) : null;
    return `
    <div class="run-row">
      <div class="run-main">
        <div class="run-date">${formatShortDate(w.date)}</div>
      </div>
      <div class="run-stats display">${w.weight.toFixed(1)} lb
        ${d !== null ? `<div class="pace" style="color:${d<0?'var(--accent2)':d>0?'var(--warn)':'var(--ink-soft)'}">${d>0?'+':''}${d.toFixed(1)}</div>` : ''}
      </div>
      <button class="del-btn" data-del-weight="${w.id}">&times;</button>
    </div>`;
  }).join('') : `<div class="empty-state">No weight logged yet.</div>`;

  return `
    <div class="card">
      <label class="field-label" for="weightInput">Weight (lb)</label>
      <input type="text" id="weightInput" inputmode="decimal" placeholder="e.g. 165.4">
      <label class="field-label" for="weightDate">Date</label>
      <input type="date" id="weightDate" value="${todayISO()}">
      <button class="add-btn alt" id="logWeightBtn">+ Log weight</button>
    </div>
    ${latest ? `
    <div class="card">
      <div class="weight-summary-row">
        <div class="weight-current"><span class="num display">${latest.weight.toFixed(1)}</span> <span class="muted">lb, latest</span></div>
        ${delta !== null ? `<div class="weight-delta ${delta<0?'down':delta>0?'up':''}">${delta>0?'+':''}${delta.toFixed(1)} lb</div>` : ''}
      </div>
      <div class="muted">as of ${formatShortDate(latest.date)}</div>
    </div>` : ''}
    <div class="section-title">History</div>
    <div class="card">${listHTML}</div>
  `;
}
function attachWeightHandlers(){
  document.getElementById('logWeightBtn').onclick = () => {
    const el = document.getElementById('weightInput');
    const weight = parseFloat(el.value);
    const date = document.getElementById('weightDate').value || todayISO();
    if (!weight || weight <= 0) { el.style.borderColor = 'var(--warn)'; showToast('Enter a valid weight'); return; }
    const entry = { id: 'w'+Date.now()+Math.random().toString(36).slice(2,7), date, weight, createdAt: Date.now() };
    weights.push(entry); saveData(); showToast('Weight logged'); render();
  };
  document.querySelectorAll('[data-del-weight]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-del-weight');
      openModal({
        title: 'Delete this entry?',
        text: "This removes it from your weight log permanently.",
        confirmLabel: 'Delete',
        onConfirm: () => { weights = weights.filter(w => w.id !== id); saveData(); showToast('Entry deleted'); render(); }
      });
    };
  });
}

// ---------- OVERVIEW tab ----------
function typeBreakdownHTML(periodRuns){
  const byType = {};
  periodRuns.forEach(r => { byType[r.type] = (byType[r.type] || 0) + r.mileage; });
  const maxMiles = Math.max(...RUN_TYPES.map(t => byType[t.key] || 0), 1);
  return RUN_TYPES.map(t => {
    const miles = byType[t.key] || 0;
    const pct = Math.max(miles > 0 ? 4 : 0, Math.round(miles/maxMiles*100));
    const count = periodRuns.filter(r => r.type === t.key).length;
    return `
      <div class="bar-row">
        <div class="bar-row-top"><span>${t.label} <span class="muted">(${count})</span></span><span class="display">${miles.toFixed(1)} mi</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${t.color}"></div></div>
      </div>`;
  }).join('');
}
function weightTrendHTML(){
  const sorted = weights.slice().sort((a,b) => (a.date < b.date ? -1 : 1));
  if (sorted.length < 1) return `<div class="section-title">Weight trend</div><div class="card"><div class="empty-state">No weight logged yet.</div></div>`;
  const first = sorted[0], last = sorted[sorted.length-1];
  const change = last.weight - first.weight;
  const points = sorted.map((w,i) => ({ x: i, y: w.weight }));
  return `
    <div class="section-title">Weight trend <span style="text-transform:none;letter-spacing:0;">(all-time)</span></div>
    <div class="card">
      <div class="big-stat-row">
        <div class="big-stat"><div class="num display">${last.weight.toFixed(1)}</div><div class="lbl">Latest (lb)</div></div>
        <div class="big-stat"><div class="num display" style="color:${change<0?'var(--accent2)':change>0?'var(--warn)':'var(--ink)'}">${change>0?'+':''}${change.toFixed(1)}</div><div class="lbl">Since ${formatShortDate(first.date)}</div></div>
      </div>
      <div class="sparkline-wrap">${sparklineSVG(points, 'var(--accent2)')}</div>
    </div>`;
}
function renderOverviewMonth(){
  const { y, m } = monthCursor;
  const ym = `${y}-${String(m+1).padStart(2,'0')}`;
  const periodRuns = runs.filter(r => r.date.startsWith(ym));
  const totalMiles = periodRuns.reduce((s,r) => s + r.mileage, 0);
  const totalTime = periodRuns.reduce((s,r) => s + r.seconds, 0);
  const avgPace = totalMiles ? formatPace(totalTime, totalMiles) : '—';
  const longest = periodRuns.length ? Math.max(...periodRuns.map(r => r.mileage)) : 0;
    const totalCalories = periodRuns.reduce((s,r) => s + (r.calGross || 0), 0);
  const anyCalData = periodRuns.some(r => r.calGross);

  const daysInMonth = new Date(y, m+1, 0).getDate();
  const weekBuckets = [0,0,0,0,0,0];
  periodRuns.forEach(r => {
    const day = parseISO(r.date).getDate();
    const w = Math.min(5, Math.floor((day-1)/7));
    weekBuckets[w] += r.mileage;
  });
  const numWeeks = Math.ceil(daysInMonth/7);
  const maxWeek = Math.max(...weekBuckets.slice(0,numWeeks), 1);
  const weekHTML = weekBuckets.slice(0,numWeeks).map((miles,i) => {
    const pct = Math.max(miles>0?4:0, Math.round(miles/maxWeek*100));
    return `
      <div class="bar-row">
        <div class="bar-row-top"><span>Week ${i+1}</span><span class="display">${miles.toFixed(1)} mi</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:var(--accent)"></div></div>
      </div>`;
  }).join('');

  return `
    <div class="card">
      <div class="nav-row">
        <button class="nav-btn" id="ovPrev">&lsaquo;</button>
        <span class="nav-title">${MONTH_NAMES[m]} ${y}</span>
        <button class="nav-btn" id="ovNext">&rsaquo;</button>
      </div>
      <div class="big-stat-row" style="margin-top:14px;">
        <div class="big-stat"><div class="num display">${totalMiles.toFixed(1)}</div><div class="lbl">Total miles</div></div>
        <div class="big-stat"><div class="num display">${periodRuns.length}</div><div class="lbl">Runs</div></div>
        <div class="big-stat"><div class="num display">${avgPace}</div><div class="lbl">Avg pace</div></div>
        <div class="big-stat"><div class="num display">${longest.toFixed(1)}</div><div class="lbl">Longest run</div></div>
        <div class="big-stat"><div class="num display">${anyCalData ? totalCalories.toLocaleString() : '—'}</div><div class="lbl">Calories burned</div></div>
      </div>
    </div>
    <div class="section-title">By week</div>
    <div class="card">${weekHTML}</div>
    <div class="section-title">By type</div>
    <div class="card">${typeBreakdownHTML(periodRuns)}</div>
    ${weightTrendHTML()}
  `;
}
function renderOverviewYear(){
  const y = yearCursor;
  const periodRuns = runs.filter(r => r.date.startsWith(String(y)));
  const totalMiles = periodRuns.reduce((s,r) => s + r.mileage, 0);
  const totalTime = periodRuns.reduce((s,r) => s + r.seconds, 0);
  const avgPace = totalMiles ? formatPace(totalTime, totalMiles) : '—';
  const longest = periodRuns.length ? Math.max(...periodRuns.map(r => r.mileage)) : 0;
    const totalCalories = periodRuns.reduce((s,r) => s + (r.calGross || 0), 0);
  const anyCalData = periodRuns.some(r => r.calGross);

  const byMonth = new Array(12).fill(0);
  periodRuns.forEach(r => { const mo = parseInt(r.date.slice(5,7),10) - 1; byMonth[mo] += r.mileage; });
  const maxMonth = Math.max(...byMonth, 1);
  const monthHTML = byMonth.map((miles,i) => {
    const pct = Math.max(miles>0?4:0, Math.round(miles/maxMonth*100));
    return `
      <div class="bar-row">
        <div class="bar-row-top"><span>${MONTH_SHORT[i]}</span><span class="display">${miles.toFixed(1)} mi</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:var(--accent)"></div></div>
      </div>`;
  }).join('');

  return `
    <div class="card">
      <div class="nav-row">
        <button class="nav-btn" id="ovPrev">&lsaquo;</button>
        <span class="nav-title">${y}</span>
        <button class="nav-btn" id="ovNext">&rsaquo;</button>
      </div>
      <div class="big-stat-row" style="margin-top:10px;">
        <div class="big-stat"><div class="num display">${totalMiles.toFixed(1)}</div><div class="lbl">Total miles</div></div>
        <div class="big-stat"><div class="num display">${periodRuns.length}</div><div class="lbl">Runs</div></div>
        <div class="big-stat"><div class="num display">${avgPace}</div><div class="lbl">Avg pace</div></div>
        <div class="big-stat"><div class="num display">${longest.toFixed(1)}</div><div class="lbl">Longest run</div></div>
        <div class="big-stat"><div class="num display">${anyCalData ? totalCalories.toLocaleString() : '—'}</div><div class="lbl">Calories burned</div></div>
      </div>
    </div>
    <div class="section-title">By month</div>
    <div class="card">${monthHTML}</div>
    <div class="section-title">By type</div>
    <div class="card">${typeBreakdownHTML(periodRuns)}</div>
    ${weightTrendHTML()}
  `;
}
let overviewPeriod = 'month';
function renderOverview(){
  const toggle = `
    <div class="card" style="padding:6px; margin-bottom:0;">
      <div style="display:flex; gap:6px;">
        <button class="tab${overviewPeriod==='month'?' active':''}" data-period="month" style="min-height:38px;">Month</button>
        <button class="tab${overviewPeriod==='year'?' active':''}" data-period="year" style="min-height:38px;">Year</button>
      </div>
    </div>`;
  return toggle + (overviewPeriod === 'month' ? renderOverviewMonth() : renderOverviewYear());
}
function attachOverviewHandlers(){
  document.querySelectorAll('[data-period]').forEach(btn => {
    btn.onclick = () => { overviewPeriod = btn.getAttribute('data-period'); render(); };
  });
  const prevBtn = document.getElementById('ovPrev');
  const nextBtn = document.getElementById('ovNext');
  if (prevBtn) prevBtn.onclick = () => {
    if (overviewPeriod === 'month') { monthCursor.m--; if (monthCursor.m<0){monthCursor.m=11;monthCursor.y--;} }
    else { yearCursor--; }
    render();
  };
  if (nextBtn) nextBtn.onclick = () => {
    if (overviewPeriod === 'month') { monthCursor.m++; if (monthCursor.m>11){monthCursor.m=0;monthCursor.y++;} }
    else { yearCursor++; }
    render();
  };
}

// ---------- main render ----------
function render(){
  document.querySelectorAll('.tab[data-tab]').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
  const content = document.getElementById('content');
  if (activeTab === 'run') { content.innerHTML = renderRunTab(); attachRunHandlers(); }
  else if (activeTab === 'weight') { content.innerHTML = renderWeightTab(); attachWeightHandlers(); }
  else { content.innerHTML = renderOverview(); attachOverviewHandlers(); }
  renderMasthead();
}
document.querySelectorAll('.tab[data-tab]').forEach(t => {
  t.addEventListener('click', () => { activeTab = t.dataset.tab; render(); });
});

function exportBackup(){
  const payload = { exportedAt: new Date().toISOString(), runs, weights };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `marathon-log-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
}
document.getElementById('backupBtn').onclick = exportBackup;

// ---------- dark mode ----------
const THEME_KEY = 'marathon_log_theme_v1';
function applyTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  document.getElementById('themeToggleBtn').textContent = mode === 'dark' ? 'Light' : 'Dark';
}
function loadTheme(){
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved) return saved;
  } catch(e){}
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch(e){}
}
document.getElementById('themeToggleBtn').onclick = toggleTheme;

// ---------- keep the focused field visible above the on-screen keyboard ----------
function scrollFieldIntoView(el){
  if (!el) return;
  setTimeout(() => {
    try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { el.scrollIntoView(); }
  }, 300);
}
document.addEventListener('focusin', (e) => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') scrollFieldIntoView(e.target);
});
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    const active = document.activeElement;
    if (active && ['INPUT','SELECT','TEXTAREA'].includes(active.tagName)) scrollFieldIntoView(active);
  });
}

(function init(){
  applyTheme(loadTheme());
  loadData();
  backfillMissingCalories();
  render();
})();
</script>
</body>
